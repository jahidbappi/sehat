[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sehat"
version = "0.1.0"
description = "Open, offline-capable chest X-ray screening for tuberculosis and pneumonia, built for low-resource clinics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Project Sehat contributors" }]
keywords = [
    "machine-learning",
    "global-health",
    "tuberculosis",
    "pneumonia",
    "chest-xray",
    "medical-imaging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
data = [
    "pandas>=2.2",
    "pyyaml>=6.0",
]
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.4",
    "hydra-core>=1.3",
    "torchmetrics>=1.4",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pillow>=10.4",
]
mlflow = [
    "mlflow>=2.16",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "onnxruntime>=1.19",
    "pandas>=2.2",
]
export = [
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=4.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
sehat-data = "sehat.data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sehat"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sehat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
